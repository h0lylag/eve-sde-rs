[modules.character]
doc = "Character creation, skills, certificates and corporation roles."

[modules.content]
doc = '''
Missions, dungeons, campaigns and other game content.

Deeply nested records that few programs read (military campaign
annotations, freelance job schemas) keep those parts as raw JSON.'''

[modules.cosmetic]
doc = "Icons, graphics, SKINs, the SKINR designer and the ship tree."

[modules.dogma]
doc = "Dogma: the attribute and effect system behind every item's numbers."

[modules.industry]
doc = "Industry: blueprints, assembly lines and their modifiers."

[modules.map]
doc = '''
The map from regions down to stargates, plus landmarks, sovereignty
resources and planetary industry schematics.'''

[modules.misc]
doc = "Everything else: fighters, sovereignty, control towers, contraband."

[modules.npc]
doc = "NPC corporations, characters, stations and factions."

[modules.types]
doc = "Items: types, groups, categories, market groups and what hangs off them."

