name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The integration tests enable `test-support` through a dev-dependency on
  # the crate itself, so only `--lib` builds a reduced feature set.
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features download"
          - "--no-default-features --features sqlite"
          - "--no-default-features --features sqlite,download"
          - "--no-default-features --features store"
          - "--no-default-features --features store,download"
          - "--no-default-features --features store,sqlite"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib ${{ matrix.features }} -- -D warnings
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
  # The model generator, and the models it writes from `schema/`.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --package xtask
      - run: cargo clippy --package xtask --all-targets -- -D warnings
      - run: cargo test --package xtask
      - run: cargo xtask models --check
  # The oldest Rust that Cargo.toml promises to support.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - run: cargo test --all-features --locked
  # Build the docs the way docs.rs does.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      - run: cargo test --doc --all-features
