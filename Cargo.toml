[package]
name = "eve-sde"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Manage EVE Online SDE data"
license = "MIT"
repository = "https://github.com/h0lylag/eve-sde-rs"
readme = "README.md"
keywords = ["eve-online", "sde", "static-data"]
categories = ["parser-implementations", "game-development"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["load"]
load = ["dep:zip", "dep:serde", "dep:serde_json"]
download = ["dep:ureq", "dep:zip", "dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
ureq = { version = "3.4.2", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "lookup"
required-features = ["load"]

[[example]]
name = "update"
required-features = ["download"]

[[example]]
name = "type_name"
required-features = ["load"]
