[package]
name = "eve-sde"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Load, search and update EVE Online's Static Data Export (SDE)"
license = "MIT"
repository = "https://github.com/h0lylag/eve-sde-rs"
readme = "README.md"
keywords = ["eve-online", "sde", "static-data"]
categories = ["parser-implementations", "game-development"]
exclude = [".cargo/", ".docs/", ".github/", ".gitignore", "schema/", "xtask/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
# `xtask` generates the models (`cargo xtask`). It is not published.
members = ["xtask"]
resolver = "3"

[workspace.dependencies]
crc32fast = "1.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["archive"]
archive = ["dep:zip", "dep:serde", "dep:serde_json"]
download = ["archive", "dep:ureq", "dep:tempfile"]
test-support = ["archive"]
# The packed record store: one file per build, with an index of its own.
store = ["archive", "dep:tempfile", "dep:crc32fast"]
# The SQLite store, linked against the system's SQLite.
sqlite = ["archive", "dep:rusqlite", "dep:tempfile"]
# The SQLite store, with SQLite compiled in.
sqlite-bundled = ["sqlite", "rusqlite/bundled"]

[dependencies]
# Already in the tree through `zip`, so the store's checksums cost no new
# dependency: the same version is compiled either way.
crc32fast = { workspace = true, optional = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["cache"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }
ureq = { version = "3.4.2", optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
# The packed store's tests check a header against its checksum the way a
# reader of the layout docs would, rather than through the crate.
crc32fast = { workspace = true }
# The integration tests build their archives with the `testing` module.
eve-sde = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "forbid"

# Each lint below enforces one of the crate's coding rules.
[workspace.lints.clippy]
# Clippy's pedantic lints. Where one must yield, `#[expect(...)]` says why.
pedantic = { level = "warn", priority = -1 }
# A type's name inside its own `impl` is `Self`. A nursery lint.
use_self = "warn"
# `as` only where truncation, wrapping or rounding is the intent, stated with
# `#[expect(..., reason = "...")]`.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Public functions document their errors and panics.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Modules are `foo.rs` with children in `foo/`, not `foo/mod.rs`.
mod_module_files = "warn"
# Production code uses `expect` with the reason, or handles the error.
unwrap_used = "warn"

[lints]
workspace = true

[[example]]
name = "lookup"
required-features = ["archive"]

[[example]]
name = "update"
required-features = ["download"]

[[example]]
name = "type_name"
required-features = ["archive"]
